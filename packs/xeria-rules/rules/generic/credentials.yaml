# Kredensial yang tertulis di kode dan konfigurasi, lintas bahasa.
rules:
  - id: connection-string-with-credentials
    languages: [generic]
    paths:
      include:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.mjs"
        - "*.cjs"
        - "*.py"
        - "*.php"
        - "*.go"
        - "*.java"
        - "*.kt"
        - "*.rb"
        - "*.cs"
        - "*.dart"
        - "*.rs"
        - "*.yml"
        - "*.yaml"
        - "*.json"
        - "*.toml"
        - "*.properties"
        - "*.xml"
        - "*.ini"
        - "*.conf"
    severity: ERROR
    message: >-
      Connection string basis data/antrian memuat username dan password yang
      tertulis langsung, termasuk sebagai nilai cadangan (misalnya
      process.env.DATABASE_URL || 'mysql://user:password@...'). Bila variabel
      lingkungannya lupa diisi, aplikasi berjalan dengan kredensial yang
      diketahui siapa pun yang membaca kode. Hapus nilai cadangan dan hentikan
      aplikasi bila konfigurasinya tidak ada.
    pattern-regex: (?i)\b(mysql|mariadb|postgres|postgresql|mongodb(\+srv)?|redis|rediss|amqps?|mssql|sqlserver|oracle|mysql\+pymysql|postgresql\+psycopg2?)://[^:\s'"/@$`{}<>%]*:(?!\*+@|x+@|\.\.\.@)[^@\s'"$`{}<>%]+@
    metadata:
      judul: "Connection string memuat username dan password"
      category: security
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [mysql, postgres, mongodb, redis, drizzle, prisma, sqlalchemy]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  - id: minio-default-credentials
    languages: [regex]
    paths:
      include: ["*.yaml", "*.yml", "*.env", "*.env.*", ".env*", "*.toml", "*.json", "*.properties", "*.go", "*.ts", "*.js", "*.py", "*.php"]
    severity: WARNING
    message: >-
      Kredensial bawaan MinIO (minioadmin) dipakai sebagai kunci akses
      penyimpanan objek. Nilai ini tercantum di dokumentasi resmi MinIO dan
      menjadi tebakan pertama penyerang: siapa pun yang menjangkau endpoint
      S3-nya dapat membaca, mengganti, atau menghapus seluruh berkas yang
      diunggah. Ganti MINIO_ROOT_USER/MINIO_ROOT_PASSWORD dan kunci akses
      aplikasi dengan nilai acak, simpan di luar repositori.
    # Pola Puspalad: s3.access_key_id / access_key_secret berawalan minioadmin.
    pattern-regex: >-
      (?im)^[^\n#]*\b(minio_root_(user|password)|minio_(access|secret)_key|access_?key(_?id|_?secret)?|secret_?(access_?)?key)["']?\s*[:=]\s*["']?minioadmin\w*["']?
    metadata:
      judul: "Kredensial bawaan MinIO (minioadmin) dipakai"
      category: security
      subcategory: [vuln]
      cwe: "CWE-1392: Use of Default Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [minio, s3, docker]
      references:
        - https://min.io/docs/minio/linux/reference/minio-server/settings/root-credentials.html
