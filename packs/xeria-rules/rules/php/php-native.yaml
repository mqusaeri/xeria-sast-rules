  # Bentuk konstanta, dipisah dari aturan di atas karena metavariable-regex
  # tidak boleh dipakai lintas cabang pattern-either yang tidak mengikat
  # metavariabelnya. Ditemukan lewat korem 012: `wp-config.php` memuat
  # DB_PASSWORD asli, tetapi tidak satu mesin pun melaporkannya — regex
  # generic-api-key Gitleaks menolak nilai bersimbol (`User@mabesAD000`),
  # dan aturan kredensial DB hanya mengenal `$var = "…"`.
  - id: php-hardcoded-credential-constant
    languages: [php]
    severity: ERROR
    message: >-
      Kata sandi literal ditemukan dalam konstanta konfigurasi. Password/changeme bukan nilai aman ketika dipakai
      sebagai default aplikasi. Pindahkan ke secret dari lingkungan atau konfigurasi terlindungi dan rotasi bila
      pernah terpapar.
    patterns:
      - pattern-either:
          - pattern: define($NAMA, "$NILAI")
          - pattern: define($NAMA, '$NILAI')
      # Nama konstanta yang menyatakan kata sandi, bukan setelan tentang
      # kata sandi (PASSWORD_MIN_LENGTH, PASSWORD_HASH_ALGO, label formulir).
      - metavariable-regex:
          metavariable: $NAMA
          regex: 
            (?i)^['"](?!.*(_(length|algo|type|field|label|url|regex|hint|placeholder)))\w*(pass(word|wd)?|pwd|sandi)\w*['"]$
      - metavariable-regex:
          metavariable: $NILAI
          # `password_here` adalah isi wp-config-sample.php bawaan WordPress —
          # berkas contoh yang selalu ikut, bukan kredensial.
          regex: 
            ^(?!(bcrypt|argon2i?d?|md5|sha1|sha256|xxx+|\*+|\w*_here|your_\w+|put[_-]?your[_-]?\w+)$).{1,}$
    metadata:
      judul: "Kata sandi tertulis sebagai konstanta (PHP)"
      category: security
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  - id: php-hardcoded-crypto-key
    languages: [php]
    severity: ERROR
    message: >-
      Kunci enkripsi tertulis langsung di kode. Bila kodenya dibagikan atau
      berasal dari aplikasi sumber terbuka, kuncinya diketahui umum, sehingga
      nilai apa pun yang "diamankan" dengannya — parameter URL terenkripsi,
      token, cookie — dapat dibuat sendiri oleh penyerang. Simpan kunci di
      variabel lingkungan atau berkas konfigurasi di luar repositori, dan
      ganti kunci lama karena harus dianggap sudah bocor.
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $F(...) { ... <... openssl_encrypt(...) ...>; ... }
          - pattern-inside: |
              function $F(...) { ... <... openssl_decrypt(...) ...>; ... }
          - pattern-inside: |
              function $F(...) { ... <... mcrypt_encrypt(...) ...>; ... }
          - pattern-inside: |
              function $F(...) { ... <... sodium_crypto_secretbox(...) ...>; ... }
      - pattern-either:
          - pattern: $VAR = "$NILAI";
          - pattern: $VAR = '$NILAI';
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^\$(secret_?key|encryption_?key|crypto_?key|cipher_?key|secret_?iv|enc_?key|kunci\w*)$
      - metavariable-regex:
          metavariable: $NILAI
          regex: 
            ^(?!(secret|rahasia|changeme|change_me|your_key|isi_kunci|xxx+|\*+|<[^>]*>|\$\{[^}]*\})$).{4,}$
    metadata:
      judul: "Kunci enkripsi tertulis di kode (PHP)"
      category: security
      subcategory: [vuln]
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
