  - id: php-weak-password-hash
    languages: [php]
    severity: WARNING
    message: >-
      Kata sandi di-hash dengan MD5/SHA-1. Keduanya cepat dihitung, sehingga
      basis data yang bocor dapat dipecahkan dengan daftar kata sandi umum
      dalam hitungan menit. Pakai password_hash($sandi, PASSWORD_DEFAULT) dan
      password_verify() untuk memeriksanya.
    patterns:
      - pattern-either:
          - pattern: md5($PASS)
          - pattern: sha1($PASS)
          - pattern: hash("md5", $PASS)
          - pattern: hash("sha1", $PASS)
      - metavariable-regex:
          metavariable: $PASS
          regex: (?i).*(pass|pwd|sandi|passwd|password).*
    metadata:
      judul: "Kata sandi di-hash dengan MD5 atau SHA-1 (PHP)"
      category: security
      subcategory: [vuln]
