  # kodam13tniadmil …/top-notice/network_1.php: menyimpan $_GET["data"] ke
  # sesi, lalu mengganti nama dirinya menjadi po_<id sesi>__<path sesi>.php
  # — peracunan berkas sesi yang kemudian di-include sebagai PHP.
  - id: php-backdoor-session-poisoning-self-rename
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      Berkas ini menyimpan nilai dari permintaan ke dalam sesi lalu mengganti
      nama dirinya sendiri. Itu teknik peracunan berkas sesi: data penyerang
      ditulis ke berkas sesi di disk, lalu berkas itu di-include sebagai PHP
      untuk menjalankan perintah. Kode sah tidak mengganti nama berkasnya
      sendiri. Tangani sebagai insiden: hapus berkas ini, bersihkan folder
      sesi PHP, dan cari berkas bernama po_*.php.
    pattern-regex: (?s)\A(?=.*?\$_SESSION\s*\[[^\]]+\]\s*=\s*\$_(GET|POST|REQUEST|COOKIE)\b).*?\K\brename\s*\(\s*__FILE__\b
