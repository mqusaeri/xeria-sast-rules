  # Kode hasil dekode dijalankan lewat include, bukan eval — tiga bentuk:
  # * include socket_get_status($tmp)['uri'] — varian "ChaCha"
  #   doharalutsistaarhanud (…/codesample/css/core.php, tiga salinan):
  #   membaca muatan setelah __halt_compiler di berkasnya sendiri, gzinflate,
  #   geser Caesar, tulis ke tmpfile(), lalu include path berkas sementara itu;
  # * include "data:…" — kode di dalam URI data;
  # * include "skema://" dari stream wrapper yang didaftarkan berkas itu
  #   sendiri — varian "xd" (stream_wrapper_register("inc", …)).
  - id: php-backdoor-include-decoded-code
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      Berkas ini menjalankan kode yang baru didekode saat berjalan lewat
      include/require — dari berkas sementara, dari URI data:, atau dari
      stream wrapper buatannya sendiri. Teknik ini dipakai backdoor untuk
      menghindari eval() yang mudah dikenali pemindai; muatan sebenarnya
      tersandi di dalam berkas. Tangani sebagai insiden: isolasi server,
      simpan salinan berkas, hapus, dan ganti berkas tema/plugin yang disisipi
      dengan salinan bersih.
    pattern-regex: (?s)\b(include|require)(_once)?\b\s*\(?\s*(socket_get_status|stream_get_meta_data)\s*\(|\b(include|require)(_once)?\b\s*\(?\s*["']data:|\A(?=.*?\bstream_wrapper_register\s*\().*?\K\b(include|require)(_once)?\b\s*\(?\s*["'][a-z][a-z0-9+.-]*://["']\s*\.
    metadata:
      judul: "Backdoor PHP meng-include kode hasil dekode"
      category: security
      subcategory: [vuln]
      cwe: "CWE-506: Embedded Malicious Code"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://attack.mitre.org/techniques/T1027/
        - https://attack.mitre.org/techniques/T1140/

  # doharalutsistaarhanud .well-known/db.php: "PRIVDAYZ GLOBAL DB CONFIG
  # HUNTER" — menelusuri seluruh folder mencari berkas konfigurasi 20+ CMS
  # lalu mengambil DB_NAME/DB_USER/DB_PASSWORD dengan regex. Penanda nama
  # alat tidak dipakai: yang dinilai perilakunya, supaya salinan yang namanya
  # dihapus tetap tertangkap.
  - id: php-credential-harvester-cms-config
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      Berkas ini menelusuri folder server mencari berkas konfigurasi berbagai
      CMS (wp-config.php, configuration.php Joomla, env.php Magento, dan
      lainnya) lalu mengambil kata sandi basis datanya — alat pencuri
      kredensial yang ditanam penyerang. Anggap semua kredensial basis data
      yang terjangkau dari server ini sudah bocor: ganti kata sandinya, hapus
      berkas ini setelah salinannya disimpan sebagai bukti, dan periksa akses
      ke basis data sejak berkas ini muncul.
    pattern-regex: (?s)\A(?=.*?wp-config\.php)(?=.*?configuration\.php)(?=.*?(app/etc/env\.php|sites/default/settings\.php|LocalConfiguration\.php|application/config/database\.php))(?=.*?DB_PASSWORD).*?\K\b(RecursiveDirectoryIterator|glob\s*\(|scandir\s*\()
    metadata:
