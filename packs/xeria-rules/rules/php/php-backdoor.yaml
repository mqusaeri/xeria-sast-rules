    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      Berkas gambar (atau aset statis lain) dijalankan sebagai kode PHP lewat
      include/require. Gambar sah tidak pernah di-include; yang dijalankan
      adalah kode PHP yang disembunyikan di dalam data gambar (mis. chunk
      tEXt PNG), dan baris ini adalah pemicunya — sering dijaga cookie atau
      parameter rahasia. Tangani sebagai insiden: simpan salinan berkas ini
      dan gambar yang dirujuknya, hapus keduanya, dan pulihkan berkas
      plugin/tema dari sumber resmi.
