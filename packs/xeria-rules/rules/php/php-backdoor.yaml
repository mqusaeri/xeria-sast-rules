# Backdoor dan webshell PHP yang disisipkan penyerang.
#
# Diukur di KODIM1016 (WordPress yang sudah dibobol): eval($o($p)) dengan
# payload base64 di header.php dan wp-includes/revisions.php,
# eval("\x3f\x3e" . ...) dengan ratusan goto di content.php/about.php,
# eval(base64_decode('...')) di wp-admin/network/wp/*.php. Bentuk-bentuk ini
# praktis tidak pernah muncul di kode sah.
#
# Aturan regex — kode backdoor sengaja dibuat sulit diurai parser PHP.
# Backslash literal ditulis sebagai kode heksadesimal 5c: Opengrep menafsirkan
# ulang backslash ganda.
rules:
  - id: php-backdoor-eval-decoded-payload
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      eval() menjalankan kode hasil dekode (base64_decode, gzinflate,
      str_rot13, dan sejenisnya). Pola ini adalah ciri khas backdoor/webshell:
      kode yang sebenarnya disembunyikan dari pembaca dan pemindai. Anggap
      server sudah disusupi: isolasi, periksa log akses ke berkas ini, cari
      berkas serupa, ganti seluruh kredensial, lalu pulihkan dari sumber yang
      bersih.
    pattern-regex: \beval(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\((?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*(["'](\x5cx3[fF]\x5cx3[eE]|\?>)["'](?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\.(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*)?@?(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*(base64_decode|gzinflate|gzuncompress|gzdecode|str_rot13|strrev|hex2bin|convert_uudecode|rawurldecode)(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\(
    metadata:
      judul: "Backdoor PHP menjalankan kode terenkode lewat eval"
      category: security
      subcategory: [vuln]
      cwe: "CWE-506: Embedded Malicious Code"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/506.html

  - id: php-backdoor-eval-variable-function
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      eval() menjalankan hasil pemanggilan fungsi yang namanya disimpan di
      variabel ($o($p)) atau kode yang diawali tag penutup PHP ("?>"). Kedua
      bentuk ini dipakai backdoor untuk menyamarkan base64_decode dan
      sejenisnya dari pemindai. Anggap server sudah disusupi dan tangani
      sebagai insiden.
    # "?>" biasa yang disambung ke variabel sah: Twig memuat template
    # terkompilasi dengan eval('?>' . $content). Yang dilaporkan hanya bentuk
    # heksadesimal "\x3f\x3e" (penyamaran) atau disambung ke fungsi-variabel.
    # eval(${"…"}) — variabel-variabel bernama string biner — dipakai pengacak
    # "Encryptor by Obelix666" (doharalutsistaarhanud, tiga salinan di tema
    # Divi yang tidak disebut laporan Sonnet).
    pattern-regex: \beval(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\((?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*((["'](\x5cx3[fF]\x5cx3[eE]|\?>)["']|\$\w+)(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\.(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*)?\$\w+(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\(|\beval(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\((?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*["']\x5cx3[fF]\x5cx3[eE]["'](?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\.|\beval(?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\((?:\s|/\*[^*]*\*+(?:[^/*][^*]*\*+)*/)*\$\{
    metadata:
      judul: "Backdoor PHP eval dengan fungsi dari variabel"
      category: security
      subcategory: [vuln]
      cwe: "CWE-506: Embedded Malicious Code"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/506.html

  - id: php-backdoor-goto-obfuscation
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc"]
    severity: ERROR
    message: >-
      Berkas memakai puluhan pernyataan goto untuk mengacak alur kode dan
      memanggil eval(). Pola ini dihasilkan alat pengacak kode yang dipakai
      pembuat backdoor; kode aplikasi dan pustaka yang sah tidak ditulis
      seperti ini. Tangani sebagai insiden penyusupan.
    # Laporan jatuh pada eval pertama di berkas yang memuat ≥ 20 goto.
    pattern-regex: (?s)\A(?=(?:.*?\bgoto\s+\w+\s*;){20}).*?\K\beval\s*\(
    metadata:
      judul: "Backdoor PHP disamarkan dengan goto"
      category: security
      subcategory: [vuln]
      cwe: "CWE-506: Embedded Malicious Code"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/506.html

  - id: php-webshell-signature
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      Berkas memuat penanda webshell yang dikenal (FilesMan/WSO, b374k, c99,
      r57, IndoXploit, reverse shell). Webshell memberi penyerang kendali
      penuh atas server lewat browser. Tangani sebagai insiden: isolasi
      server, simpan salinan berkas untuk forensik, hapus, dan telusuri cara
      berkas ini diunggah.
    pattern-regex: (?i)(\$default_action\s*=\s*['"]FilesMan['"]|\bb374k\b|\bc99shell\b|\br57shell\b|\bIndoXploit\b|\bWSO\s+[0-9]\.[0-9]|ULTRA\s+STEALTH\s+REVERSE\s+SHELL|\bfsockopen\s*\([^;]*\)\s*;[^;]*\b(proc_open|shell_exec|passthru)\s*\(|Encrypt(or|ed)[ \t]+by[ \t:]*Obelix666)
    metadata:
      judul: "Tanda tangan webshell PHP yang dikenal"
      category: security
      subcategory: [vuln]
      cwe: "CWE-506: Embedded Malicious Code"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/506.html

  # Ditemukan di KODIM1016 saat memverifikasi temuan lain:
  # wp-content/languages/0ft8h8o9.php ("BDKR28 is here") — gerbang sandi
  # `?BDKR28=llbl` lalu move_uploaded_file ke nama berkas dari klien. Tidak
  # memakai eval/base64/goto, sehingga seluruh aturan backdoor yang ada
  # melewatkannya; yang melaporkannya hanya aturan unggahan (MEDIUM).
  - id: php-backdoor-password-gated-dangerous-script
    languages: [php]
    severity: ERROR
    message: >-
      Berkas ini dijaga kata sandi yang tertulis di kodenya sendiri, lalu
      menjalankan perintah, menulis berkas, atau menerima unggahan. Itu
      bentuk webshell: aplikasi yang sehat memakai sesi login aplikasinya,
      bukan satu kata sandi tetap di dalam berkas. Tangani sebagai insiden —
      isolasi server, simpan salinannya untuk forensik, hapus berkasnya, lalu
      telusuri cara berkas ini sampai ke server.
    patterns:
      - pattern-either:
          - pattern: move_uploaded_file(...)
          - pattern: eval(...)
          - pattern: system(...)
          - pattern: shell_exec(...)
          - pattern: passthru(...)
          - pattern: proc_open(...)
          - pattern: popen(...)
          - pattern: file_put_contents(...)
      # Nilai dari permintaan dibandingkan dengan literal, lalu berhenti bila
      # tidak cocok: gerbang autentikasi berkata sandi tetap.
      - pattern-either:
          - pattern-inside: |
              $P = <... $_GET[...] ...>;
              ...
              if ($P !== "$LIT") { ... exit; }
              ...
          - pattern-inside: |
              $P = <... $_POST[...] ...>;
              ...
              if ($P !== "$LIT") { ... exit; }
              ...
          - pattern-inside: |
              $P = <... $_REQUEST[...] ...>;
              ...
              if ($P !== "$LIT") { ... exit; }
              ...
          - pattern-inside: |
              $P = <... $_COOKIE[...] ...>;
              ...
              if ($P !== "$LIT") { ... exit; }
              ...
      # Variabel gerbangnya dinamai sandi/kunci/token — `if ($action !==
      # 'save') { exit; }` pada aplikasi biasa tidak ikut.
      - metavariable-regex:
          metavariable: $P
          regex: (?i)^\$\w*(pass|pwd|sandi|kunci|key|token|auth|secret)\w*$
    metadata:
      judul: "Skrip berbahaya berpelindung kata sandi (backdoor PHP)"
      category: security
      subcategory: [vuln]
      cwe: "CWE-506: Embedded Malicious Code"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/506.html


  # KODIM1016 `wp-content/languages/chat_ai.php`: file manager lengkap tanpa
  # autentikasi apa pun — unggah ke direktori pilihan, hapus rekursif,
  # rename, dan sunting berkas. Yang menentukan bukan jumlah fiturnya,
  # melainkan satu baris ini: tujuan DAN isi tulisan sama-sama dari
  # permintaan. `is_safe_path()` di sana hanya memanggil realpath(), jadi
  # tidak membatasi apa pun.
  - id: php-arbitrary-file-write-from-request
    languages: [php]
    severity: ERROR
    message: >-
      Berkas ditulis dengan tujuan dan isi yang sama-sama berasal dari
      permintaan. Siapa pun yang dapat memanggil halaman ini dapat menulis
      berkas PHP baru di server dan menjalankannya — setara memberi akses
      penuh. Bila halaman ini tidak Anda tulis sendiri, perlakukan sebagai
      webshell: isolasi server, simpan salinannya untuk forensik, hapus, lalu
      telusuri cara berkas ini sampai ke server. Bila ini memang fitur
      aplikasi, tujuannya harus dikunci ke satu folder (path tetap + nama
      yang dibuat server) dan aksinya diberi pemeriksaan hak akses.
    patterns:
      - pattern: file_put_contents($P, $C, ...)
      - metavariable-pattern:
          metavariable: $C
          patterns:
            - pattern-either:
                - pattern: $_POST[...]
                - pattern: $_GET[...]
                - pattern: $_REQUEST[...]
      - pattern-either:
          - pattern-inside: |
              $P = <... $_GET[...] ...>;
              ...
          - pattern-inside: |
              $P = <... $_POST[...] ...>;
              ...
          - pattern-inside: |
              $P = <... $_REQUEST[...] ...>;
              ...
    metadata:
      judul: "Penulisan berkas bebas dari permintaan (PHP)"
      category: security
      subcategory: [vuln]
      cwe: "CWE-434: Unrestricted Upload of File with Dangerous Type"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/434.html

