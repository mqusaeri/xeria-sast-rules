  # kodam13tniadmil …/top-notice/decryptor.php dan envload.php (84 byte,
  # identik): `$_SESSION["\x58\x2d\x48\x30\x55\x52"] = true; echo "ok";` —
  # kunci sesi "X-H0UR" yang membuka webshell bergerbang sesi. Nama kunci
  # sesi yang disamarkan heksadesimal tidak dipakai kode sah.
  - id: php-backdoor-hex-escaped-session-key
    languages: [regex]
    paths:
      include: ["*.php", "*.phtml", "*.inc", "*.php5", "*.php7"]
    severity: ERROR
    message: >-
      Nilai sesi ditulis dengan nama kunci yang disamarkan sebagai escape
      heksadesimal ("\x58\x2d…"). Aplikasi sah menulis nama kunci sesi apa
      adanya; bentuk ini dipakai berkas pembuka yang menandai sesi penyerang
      supaya webshell bergerbang sesi di tempat lain mau dijalankan. Tangani
      sebagai insiden dan cari berkas lain yang membaca kunci sesi yang sama.
    pattern-regex: \$_SESSION\s*\[\s*["'](\x5cx[0-9a-fA-F]{2}){3,}["']\s*\]\s*=
