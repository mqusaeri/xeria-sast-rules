# Java: kredensial dan kunci enkripsi yang tertulis di kode.
#
# Aplikasi desktop dan seluler dikirim utuh ke komputer pengguna; berkas .jar
# atau .apk dapat dibuka dengan dekompiler dalam hitungan menit, jadi setiap
# literal di dalamnya harus dianggap diketahui umum. Diukur di SIMRS
# Soepraoen: kata sandi API TTE produksi tertulis di bridging/ApiWebTTE.java,
# dan kunci AES_ENCRYPT kata sandi pengguna ('nur'/'windi', bawaan
# SIMRS-Khanza) tertulis di ratusan query.
rules:
  - id: java-hardcoded-password-variable
    languages: [java]
    severity: ERROR
    message: >-
      Kata sandi, token, atau kunci API ditulis langsung di kode sebagai nilai
      variabel. Siapa pun yang memegang berkas aplikasi (.jar/.apk/.class)
      atau repositori kodenya dapat membacanya dan masuk ke layanan itu atas
      nama aplikasi. Pindahkan ke berkas konfigurasi di luar paket aplikasi,
      variabel lingkungan, atau penyimpanan rahasia; lalu ganti (rotasi) nilai
      yang sudah terlanjur tertulis, karena nilai lama harus dianggap bocor.
    patterns:
      - pattern-either:
          - pattern: $V = "$S";
          - pattern: $T $V = "$S";
      # Nama variabel yang menyebut rahasia, tetapi bukan label, kolom isian,
      # aturan panjang, atau alamat.
      - metavariable-regex:
          metavariable: $V
          regex: ^(?!.*(?i:field|label|lbl|txt|text|input|prompt|hint|length|len$|min|max|policy|regex|pattern|url|uri|path|endpoint|header|param|type|expir|time|file|dialog|column|mask|char|hash|salt|encoded|encrypted|enc$)).*(?i:passw(?:or)?d|passwd|pwd|secret|api_?key|access_?token|auth_?token|bearer|private_?key|client_?secret|sandi).*$
      - metavariable-regex:
          metavariable: $S
          regex: ^(?!(?i:changeme|change_me|password|secret|your|xxx|test|example|dummy|null|none|todo|isi)\b)(?![*xX#.]{3,}$)(?!\$\{)(?!%)(?!https?://)\S{4,}$
    metadata:
      judul: "Kata sandi atau kunci API tertulis di kode (Java)"
      category: security
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      technology: [java, swing, android, spring, simrs-khanza]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/798.html

  - id: java-hardcoded-password-argument
    languages: [java]
    severity: ERROR
    message: >-
      Kata sandi literal dikirim langsung ke koneksi basis data, surel, atau
      autentikasi HTTP. Nilainya ikut terbawa di setiap salinan aplikasi dan
      dapat dibaca dengan dekompiler. Baca kata sandi dari konfigurasi di luar
      paket aplikasi atau penyimpanan rahasia, dan ganti nilai yang sudah
      terlanjur tertulis.
    pattern-either:
      - patterns:
          - pattern: DriverManager.getConnection($URL, $U, "$P")
          - metavariable-regex:
              metavariable: $P
              regex: ^\S{3,}$
      - patterns:
          - pattern: $X.setPassword("$P")
          - metavariable-regex:
              metavariable: $P
              regex: ^\S{3,}$
      - patterns:
          - pattern: new PasswordAuthentication($U, "$P".toCharArray())
          - metavariable-regex:
              metavariable: $P
              regex: ^\S{3,}$
      - patterns:
          - pattern: $X.setBasicAuth($U, "$P")
          - metavariable-regex:
              metavariable: $P
              regex: ^\S{3,}$
    metadata:
      judul: "Kata sandi literal dipakai untuk koneksi (Java)"
      category: security
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [java, jdbc, swing, android, spring]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  - id: java-secretkeyspec-literal-key
    languages: [java]
    severity: ERROR
    message: >-
      Kunci enkripsi dibuat dari teks yang tertulis di kode. Kunci itu sama di
      setiap salinan aplikasi dan dapat dibaca dengan dekompiler, sehingga
      semua data yang dienkripsi dengannya dapat dibuka siapa pun. Bangkitkan
      kunci dengan KeyGenerator/SecureRandom dan simpan di penyimpanan kunci
      (Java KeyStore, Android Keystore) atau terima dari server, bukan literal.
    pattern-either:
      - pattern: new SecretKeySpec("$K".getBytes(...), ...)
      - pattern: new SecretKeySpec("$K".getBytes(), ...)
      - patterns:
          - pattern-inside: |
              class $CLS {
                ...
                $T $KEY = "$K";
                ...
              }
          - pattern-either:
              - pattern: new SecretKeySpec($KEY.getBytes(...), ...)
              - pattern: new SecretKeySpec($KEY.getBytes(), ...)
      - patterns:
          - pattern-inside: |
              $T $KEY = "$K";
              ...
          - pattern-either:
              - pattern: new SecretKeySpec($KEY.getBytes(...), ...)
              - pattern: new SecretKeySpec($KEY.getBytes(), ...)
    metadata:
      judul: "Kunci enkripsi dibuat dari teks tertulis di kode (Java)"
      category: security
      subcategory: [vuln]
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [java, android, swing]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
        - https://developer.android.com/privacy-and-security/keystore
