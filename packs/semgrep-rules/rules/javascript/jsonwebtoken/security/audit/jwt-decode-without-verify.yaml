rules:
- id: jwt-decode-without-verify
  message: JWT decode returns claims without authenticating them. Review any use of these claims for authorization;
    prefer the claims returned by jwt.verify with the expected key, algorithms, issuer and audience. A verify
    call elsewhere, in a dead branch, or after use does not establish that these claims were verified. Display-only
    decoding may be intentional.
  metadata:
    cwe:
    - 'CWE-345: Insufficient Verification of Data Authenticity'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    source-rule-url: https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
    asvs:
      section: 'V3: Session Management Verification Requirements'
      control_id: 3.5.3 Insecue Stateless Session Tokens
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x12-V3-Session-management.md#v35-token-based-session-management
      version: '4'
    category: security
    technology:
    - jwt
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
    references:
    - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
  languages:
  - javascript
  - typescript
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern-inside: '$JWT = require(''jsonwebtoken'');

        ...'
    - pattern-inside: 'import $JWT from ''jsonwebtoken'';

        ...'
    - pattern-inside: 'import * as $JWT from ''jsonwebtoken'';

        ...'
  - pattern: $JWT.decode($TOKEN, ...)
