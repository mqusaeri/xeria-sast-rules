rules:
- id: unrestricted-github-oidc-policy
  metadata:
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - terraform
    - aws
    owasp:
    - A05:2017 - Sensitive Data Exposure
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    cwe:
    - 'CWE-1220: Insufficient Granularity of Access Control'
    references:
    - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services#configuring-the-role-and-trust-policy
    - https://dagrz.com/writing/aws-security/hacking-github-aws-oidc/
  message: 'Review this GitHub OIDC trust statement: its subject condition is missing, uses an operator that
    does not establish the expected allowlist, or contains a value without a fixed owner/repository. Restrict
    sub to trusted repositories and the intended branch/environment using StringEquals or a carefully scoped
    StringLike; verify audience and the complete trust policy separately.'
  languages:
  - hcl
  severity: WARNING
  patterns:
  - pattern-inside: "data \"aws_iam_policy_document\" $POLICY {\n  ...\n}"
  - &id001
    pattern: "statement {\n  ...\n  principals {\n    ...\n    type = \"Federated\"\n    identifiers = [...,\
      \ $IDENTIFIER, ...]\n  }\n}"
  - metavariable-regex:
      metavariable: $IDENTIFIER
      regex: .*oidc-provider/token\.actions\.githubusercontent\.com
  - pattern-either:
    - patterns:
      - *id001
      - pattern-not: "statement {\n  ...\n  condition {\n    ...\n    variable = \"token.actions.githubusercontent.com:sub\"\
          \n  }\n}"
    - patterns:
      - pattern: "statement {\n  ...\n  condition {\n    ...\n    variable = \"token.actions.githubusercontent.com:sub\"\
          \n    values = [..., \"$SUB\", ...]\n  }\n}"
      - metavariable-regex:
          metavariable: $SUB
          regex: ^(?!repo:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+:).*$
    - patterns:
      - pattern: "statement {\n  ...\n  condition {\n    ...\n    variable = \"token.actions.githubusercontent.com:sub\"\
          \n    test = \"$OP\"\n  }\n}"
      - metavariable-regex:
          metavariable: $OP
          regex: ^(?!(?:StringEquals|StringLike)$).*$
