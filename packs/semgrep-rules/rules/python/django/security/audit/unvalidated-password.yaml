rules:
- id: unvalidated-password
  patterns:
  - pattern-not-inside: 'django.contrib.auth.password_validation.validate_password($X, ...)

      ...'
  - pattern-not: UserModel().set_password($X)
  - pattern: $MODEL.set_password($X)
  message: Review password validation before setting this password. Call django.contrib.auth.password_validation.validate_password
    with this password and user, then set_password only if validation returns normally. The validator returns
    None on success and raises ValidationError on failure; do not put it in an if condition or swallow the
    exception. Validation enforced in a reviewed caller may be intentional. No automatic fix is provided because
    imports, expression side effects and exception handling depend on the application.
  metadata:
    cwe:
    - 'CWE-521: Weak Password Requirements'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://docs.djangoproject.com/en/3.0/topics/auth/passwords/#module-django.contrib.auth.password_validation
    category: security
    technology:
    - django
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  languages:
  - python
  severity: WARNING
