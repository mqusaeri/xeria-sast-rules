rules:
- id: openai-missing-max-tokens-python
  languages:
  - python
  severity: WARNING
  message: This call does not specify a response token budget locally. Check model defaults and centrally
    configured limits before treating it as a resource-consumption risk; use the parameter supported by
    the SDK/model version.
  metadata:
    cwe: 'CWE-1188: Initialization with an Insecure Default'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - openai
    references:
    - https://developers.openai.com/api/docs/guides/safety-best-practices
  patterns:
  - pattern: $CLIENT.chat.completions.create(...)
  - pattern-not: $CLIENT.chat.completions.create(..., max_tokens=$MT, ...)
  - pattern-not: $CLIENT.chat.completions.create(..., max_completion_tokens=$MT, ...)
