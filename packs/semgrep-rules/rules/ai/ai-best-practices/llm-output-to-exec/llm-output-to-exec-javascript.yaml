rules:
- id: llm-output-to-exec-javascript
  mode: taint
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: LLM API response data flows into a dangerous code execution function (eval, new Function, child_process.exec).
    This enables code injection attacks where a compromised or manipulated LLM response can execute arbitrary
    code on the host system. Validate and sandbox LLM outputs before execution.
  metadata:
    cwe: 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    category: security
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    technology:
    - openai
    - anthropic
    references:
    - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  pattern-sources:
  - pattern: $CLIENT.chat.completions.create(...)
  - pattern: await $CLIENT.chat.completions.create(...)
  - pattern: $CLIENT.messages.create(...)
  - pattern: await $CLIENT.messages.create(...)
  - pattern: $CLIENT.responses.create(...)
  - pattern: await $CLIENT.responses.create(...)
  - pattern: $CLIENT.responses.parse(...)
  - pattern: await $CLIENT.responses.parse(...)
  - pattern: $CLIENT.chat.complete(...)
  - pattern: await $CLIENT.chat.complete(...)
  pattern-sinks:
  - patterns:
    - pattern: eval($SINK)
    - focus-metavariable: $SINK
  - patterns:
    - pattern: new Function($SINK)
    - focus-metavariable: $SINK
  - patterns:
    - pattern: child_process.exec($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern: child_process.execSync($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern: 'child_process.spawn($SINK, ..., { ..., shell: true, ... })'
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'import { exec as $RUN } from "node:child_process";

        ...'
    - pattern: $RUN($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'const { exec: $RUN } = require("node:child_process");

        ...'
    - pattern: $RUN($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'const $CP = require("node:child_process");

        ...'
    - pattern: $CP.exec($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'import * as $CP from "node:child_process";

        ...'
    - pattern: $CP.exec($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'import $CP from "node:child_process";

        ...'
    - pattern: $CP.exec($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'import { execSync as $RUN } from "node:child_process";

        ...'
    - pattern: $RUN($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'const { execSync: $RUN } = require("node:child_process");

        ...'
    - pattern: $RUN($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'const $CP = require("node:child_process");

        ...'
    - pattern: $CP.execSync($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'import * as $CP from "node:child_process";

        ...'
    - pattern: $CP.execSync($SINK, ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-inside: 'import $CP from "node:child_process";

        ...'
    - pattern: $CP.execSync($SINK, ...)
    - focus-metavariable: $SINK
