rules:
- id: npm-missing-minimum-release-age
  pattern-either:
  - patterns:
    - pattern-regex: (?s)\A(?P<TARGET>.+)\z
    - pattern-not-regex: (?m)^[ \t]*min-release-age[ \t]*=
    - focus-metavariable: $TARGET
  - patterns:
    - pattern-regex: (?m)^[ \t]*min-release-age[ \t]*=[ \t]*(?P<AGE>\d+)
    - metavariable-comparison:
        metavariable: $AGE
        comparison: int($AGE) < 7
    - focus-metavariable: $AGE
  - patterns:
    - pattern-regex: (?m)^[ \t]*min-release-age[ \t]*=[ \t]*(?P<VAL>[^\s\d#;][^\r\n]*)
    - focus-metavariable: $VAL
  - pattern-regex: (?m)^[ \t]*min-release-age[ \t]*=[ \t]*(?:[#;][^\r\n]*)?$
  message: 'This .npmrc does not set a minimum release age or sets it too low. Newly published packages can
    be malicious or unstable. Add `min-release-age = 7` to wait 7 days before resolving newly published package
    versions. Added in: v11.10 Reference: https://github.blog/changelog/2026-02-18-npm-bulk-trusted-publishing-config-and-script-security-now-generally-available/'
  languages:
  - generic
  severity: MEDIUM
  paths:
    include:
    - '**/.npmrc'
  metadata:
    category: security
    technology:
    - npm
    - javascript
    cwe:
    - 'CWE-829: Inclusion of Functionality from Untrusted Control Sphere'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    confidence: MEDIUM
    likelihood: LOW
    impact: HIGH
    subcategory:
    - audit
    vulnerability_class:
    - Insecure Configuration
    references:
    - https://github.blog/changelog/2026-02-18-npm-bulk-trusted-publishing-config-and-script-security-now-generally-available/
    - https://github.com/npm/cli/pull/8965
