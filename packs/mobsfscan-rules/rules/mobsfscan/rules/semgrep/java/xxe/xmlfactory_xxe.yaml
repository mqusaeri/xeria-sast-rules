rules:
- id: xmlinputfactory_xxe
  patterns:
  - pattern-either:
    - pattern: $XMLFACTORY = XMLInputFactory.newFactory(...)
    - pattern: $XMLFACTORY = XMLInputFactory.newInstance(...)
    - pattern: $XMLFACTORY = javax.xml.stream.XMLInputFactory.newFactory(...)
    - pattern: $XMLFACTORY = javax.xml.stream.XMLInputFactory.newInstance(...)
  - pattern-not-inside: $RETURNTYPE $METHOD(...) { ... $XMLFACTORY.setProperty("javax.xml.stream.isSupportingExternalEntities",
      false); ... }
  - pattern-not-inside: $RETURNTYPE $METHOD(...) { ... $XMLFACTORY.setProperty(javax.xml.stream.XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES,
      false); ... }
  - pattern-not-inside: $RETURNTYPE $METHOD(...) { ... $XMLFACTORY.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES,
      false); ... }
  message: Review XMLInputFactory external-entity policy. No explicit disabling call for this factory
    was found in the local method. Factory defaults and configuration outside this method must be checked
    before treating this as an XXE vulnerability.
  severity: WARNING
  languages:
  - java
  metadata:
    cwe: cwe-611
    owasp-mobile: m8
    masvs: platform-2
    reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
    confidence: LOW
    subcategory:
    - audit
