rules:
- id: ios_sha1_collision
  patterns:
  - pattern-either:
    - pattern-regex: (?i)\bSHA1\s*\(
    - pattern-regex: CC_SHA1\s*\(
  message: SHA1 is a weak hash known to have hash collisions.
  languages:
  - swift
  severity: WARNING
  metadata:
    cwe: cwe-327
    masvs: crypto-4
    owasp-mobile: m5
    reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04g-Testing-Cryptography.md#identifying-insecure-andor-deprecated-cryptographic-algorithms-mstg-crypto-4
- id: ios_weak_hash
  patterns:
  - pattern-either:
    - pattern-regex: (?i)\bMD2\s*\(
    - pattern-regex: CC_MD2\s*\(
    - pattern-regex: (?i)\bMD4\s*\(
    - pattern-regex: CC_MD4\s*\(
    - pattern-regex: (?i)\bMD5\s*\(
    - pattern-regex: CC_MD5\s*\(
    - pattern-regex: (?i)\bMD6\s*\(
    - pattern-regex: CC_MD6\s*\(
  message: Weak Hash algorithm used. The hash algorithm is known to have hash collisions.
  languages:
  - swift
  severity: WARNING
  metadata:
    cwe: cwe-327
    masvs: crypto-4
    owasp-mobile: m5
    reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04g-Testing-Cryptography.md#identifying-insecure-andor-deprecated-cryptographic-algorithms-mstg-crypto-4
- id: ios_insecure_random_no_generator
  message: A predictable C-library pseudo-random generator is used. Do not use its output for authentication
    tokens, keys, or other security decisions. On supported Apple platforms, use SystemRandomNumberGenerator
    or the platform cryptographic random APIs.
  languages:
  - swift
  severity: WARNING
  metadata:
    cwe: cwe-330
    owasp-mobile: m5
    masvs: crypto-6
    reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04g-Testing-Cryptography.md#weak-random-number-generators
    confidence: MEDIUM
  pattern-either:
  - pattern: rand()
  - pattern: random()
  - pattern: drand48()
  - pattern: lrand48()
  - pattern: mrand48()
  - pattern: Darwin.rand()
  - pattern: Darwin.random()
  - pattern: Darwin.drand48()
  - pattern: Darwin.lrand48()
  - pattern: Darwin.mrand48()
  - pattern: Glibc.rand()
  - pattern: Glibc.random()
  - pattern: Glibc.drand48()
  - pattern: Glibc.lrand48()
  - pattern: Glibc.mrand48()
