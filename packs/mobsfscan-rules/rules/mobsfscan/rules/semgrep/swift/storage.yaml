rules:
- id: ios_file_no_special
  patterns:
  - pattern-regex: (?i)\.noFileProtection\b
  message: The file has no special protections associated with it.
  languages:
  - swift
  severity: ERROR
  metadata:
    cwe: cwe-311
    masvs: storage-1
    owasp-mobile: m2
    reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x06d-Testing-Data-Storage.md#ios-data-storage
- id: ios_general_paste
  message: Data is written to the general pasteboard. Review whether it contains credentials or other
    sensitive information. Prefer avoiding sensitive clipboard data; where required, consider localOnly
    and a short expirationDate according to the supported iOS version.
  languages:
  - swift
  severity: INFO
  metadata:
    cwe: cwe-919
    masvs: platform-4
    owasp-mobile: m1
    reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x06h-Testing-Platform-Interaction.md#uipasteboard
    confidence: LOW
    subcategory:
    - audit
  pattern-either:
  - pattern: UIPasteboard.general.string = $VALUE
  - pattern: UIPasteboard.general.strings = $VALUE
  - pattern: UIPasteboard.general.items = $VALUE
  - pattern: UIPasteboard.general.image = $VALUE
  - pattern: UIPasteboard.general.images = $VALUE
  - pattern: UIPasteboard.general.url = $VALUE
  - pattern: UIPasteboard.general.urls = $VALUE
  - pattern: UIPasteboard.general.setItems(...)
  - pattern: UIPasteboard.generalPasteboard
